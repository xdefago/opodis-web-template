# Registration Configuration
#
# Visibility: Controlled by show_on_site (set false to hide registration)
#
# Structure:
#   title: Section heading
#   status: "closed", "opens_soon", "open", "deadline_approaching"
#   registration_link: URL to registration system (Google Forms, Eventbrite, etc.)
#   pricing: Early bird and standard periods with prices
#   what_is_included: List of perks
#   terms: Registration policies and terms
#
# See CONFIG.md for detailed guidance.

enabled: true
show_on_site: true

title: "Registration"

# Registration status
status: "closed"  # Options: "closed", "opens_soon", "open", "deadline_approaching"

# Link to registration system
registration_link: null  # Set when system is ready

# Early bird and standard periods
pricing:
  early_bird:
    deadline: "2024-10-31"
    student: "100 EUR"
    regular: "300 EUR"
    description: "Early bird registration"
  
  standard:
    deadline: "2024-11-30"
    student: "150 EUR"
    regular: "400 EUR"
    description: "Standard registration"
  
  on_site:
    student: "200 EUR"
    regular: "500 EUR"
    description: "On-site registration"

# What's included
what_is_included:
  - "Conference materials and program"
  - "Coffee and snacks"
  - "Lunch (Days 1-3)"
  - "Welcome reception"
  - "Conference proceedings"

# Terms
terms: |
  ## Registration Terms
  
  - At least one author of each accepted paper must register (regular) and present on-site
  - Registrations are non-refundable after [date]
  - Change of registration type is allowed until [date]
  - Attendees requiring an invitation letter for obtaining a visa may request one after completing their registration
