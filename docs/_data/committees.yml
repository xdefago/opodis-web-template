show_on_site: true

# OPODIS Committees Configuration
#
# Progression/Maturity:
#   - Stage 1 (Early): Committee structure TBD, not shown on site
#   - Stage 2 (Mid): Committee lists finalized, shown on site
#   - Stage 3 (Late): All roles and members confirmed
#
# Visibility: Controlled by `enabled` and `show_on_site` in this file.
#           Set `show_on_site: false` until content is finalized.
#
# Structure:
#   - organizing: Local organizing committee (general chairs, publication chair, team)
#   - steering: Steering committee (for series-level governance)
#   - program: Program committee (chairs and members who reviewed papers)
#
# Fields:
#   - name: Full name (required)
#   - affiliation: Organization/university (optional)
#   - role: Optional, e.g., "chair", "vice-chair" (defaults to regular member)
#
# Typical Timeline:
#   - Month 8: Steering committee mostly fixed (OPODIS governance)
#   - Month 6: General chairs, program committee chairs confirmed
#   - Month 4: Full program committee assembled
#   - Month 1: All committees finalized and published
#
# See CONFIG.md for committee timeline and publication strategy.

